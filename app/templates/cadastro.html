{% extends "base.html" %}
{% block conteudo %}
<div class="card shadow-sm mx-auto" style="max-width: 420px"><div class="card-body">
  <h1 class="h4 mb-3">Criar conta</h1>
  <form method="post">
    <div class="mb-3"><label class="form-label" for="nome">Nome</label>
      <input class="form-control" id="nome" name="nome" required autofocus></div>
    <div class="mb-3"><label class="form-label" for="email">E-mail</label>
      <input class="form-control" id="email" name="email" type="email" required></div>
    <div class="mb-3"><label class="form-label" for="senha">Senha (mín. 8 caracteres)</label>
      <input class="form-control" id="senha" name="senha" type="password" minlength="8" required></div>
    <div class="mb-3"><label class="form-label" for="senha2">Repita a senha</label>
      <input class="form-control" id="senha2" name="senha2" type="password" required></div>
    <button class="btn btn-success w-100">Criar conta</button>
  </form>
  <p class="mt-3 mb-0 small">Já tem conta? <a href="/login">Entrar</a></p>
</div></div>
{% endblock %}
