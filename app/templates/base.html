<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ManejoClima</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar bg-success navbar-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">🌱 ManejoClima</a>
    {% if user %}
    <div class="navbar-nav flex-row gap-3 me-auto ms-3">
      <a class="nav-link" href="/">Fazendas</a><a class="nav-link" href="/solos">Solos</a><a class="nav-link" href="/culturas">Culturas</a><a class="nav-link" href="/equipamentos">Equipamentos</a><a class="nav-link" href="/parcelas">Parcelas</a><a class="nav-link" href="/manejo">Manejo</a><a class="nav-link" href="/lancamentos">Lançamentos</a>
    </div>
    <form method="post" action="/logout" class="d-flex align-items-center gap-2 m-0">
      <span class="text-white small">{{ user.email }}</span>
      <button class="btn btn-sm btn-outline-light">Sair</button>
    </form>
    {% endif %}
  </div>
</nav>
<main class="container" style="max-width: 760px">
  {% if erro %}<div class="alert alert-danger">{{ erro }}</div>{% endif %}
  {% if msg %}<div class="alert alert-success">{{ msg }}</div>{% endif %}
  {% block conteudo %}{% endblock %}
</main>
</body>
</html>
