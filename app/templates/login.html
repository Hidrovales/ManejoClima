{% extends "base.html" %}
{% block conteudo %}
<div class="card shadow-sm mx-auto" style="max-width: 420px"><div class="card-body">
  <h1 class="h4 mb-3">Entrar</h1>
  <form method="post">
    <div class="mb-3"><label class="form-label" for="email">E-mail</label>
      <input class="form-control" id="email" name="email" type="email" required autofocus></div>
    <div class="mb-3"><label class="form-label" for="senha">Senha</label>
      <input class="form-control" id="senha" name="senha" type="password" required></div>
    <button class="btn btn-success w-100">Entrar</button>
  </form>
  <p class="mt-3 mb-0 small">Não tem conta? <a href="/cadastro">Criar conta</a></p>
</div></div>
{% endblock %}
